name: Refresh Supabase copy from Neon

# Phase 2: refresh the failover copy from a consistent Neon snapshot.
# The scheduled run stays disabled until the first manual run succeeds.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 19 * * *' # 04:00 JST daily

permissions:
  contents: read

concurrency:
  group: neon-to-supabase-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGCONNECT_TIMEOUT: "15"
      PGSSLMODE: require
    steps:
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate secrets and dump Neon
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }
          pg_dump "$NEON_DATABASE_URL" --format=custom --no-owner --no-privileges --file=neon.dump
          test -s neon.dump
          pg_restore --list neon.dump > archive-list.txt
          grep -q 'TABLE ' archive-list.txt || { echo "Dump contains no table entries"; exit 1; }
          echo "Neon dump created and archive contains table entries."

      - name: Capture source table names and row counts
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At             -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name"             > source-tables.txt
          test -s source-tables.txt || { echo "No public base tables found in Neon"; exit 1; }
          : > source-counts.tsv
          while IFS= read -r table; do
            quoted_table="${table//\"/\"\"}"
            count="$(psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At               -c "SELECT count(*) FROM public.\"$quoted_table\"")"
            printf '%s\t%s\n' "$table" "$count" >> source-counts.tsv
          done < source-tables.txt
          echo "Captured source table inventory and row counts."

      - name: Build transactional restore and in-transaction verification
        shell: bash
        run: |
          set -euo pipefail
          pg_restore --no-owner --no-privileges --file=restore.sql neon.dump
          # The public schema is recreated below; remove its CREATE statement from pg_restore output.
          sed '/^CREATE SCHEMA public;$/d' restore.sql > restore-filtered.sql
          expected_tables="$(while IFS= read -r table; do
            escaped="${table//\'/\'\'}"
            printf "'%s', " "$escaped"
          done < source-tables.txt)"
          expected_tables="${expected_tables%, }"
          {
            echo 'BEGIN;'
            echo 'DROP SCHEMA IF EXISTS public CASCADE;'
            echo 'CREATE SCHEMA public;'
            echo 'GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;'
            echo 'GRANT ALL ON SCHEMA public TO postgres, service_role;'
            cat restore-filtered.sql
            echo 'DO $verify$'
            echo 'DECLARE actual_tables text[]; expected_tables text[] := ARRAY['"$expected_tables"'];'
            echo 'BEGIN'
            echo "  SELECT array_agg(table_name ORDER BY table_name) INTO actual_tables FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';"
            echo '  IF actual_tables IS DISTINCT FROM expected_tables THEN RAISE EXCEPTION ''public table inventory differs from Neon snapshot''; END IF;'
            while IFS="$(printf '\t')" read -r table expected_count; do
              quoted_table="${table//\"/\"\"}"
              echo "  IF (SELECT count(*) FROM public.\"$quoted_table\") <> $expected_count THEN RAISE EXCEPTION 'row-count mismatch for $table (expected $expected_count)'; END IF;"
            done < source-counts.tsv
            echo 'END'
            echo '$verify$;'
            echo 'COMMIT;'
          } > transactional-refresh.sql

      - name: Replace Supabase copy transactionally
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DATABASE_URL" || { echo "Missing SUPABASE_DATABASE_URL secret"; exit 1; }
          # DROP, restore, inventory verification and row-count checks share one transaction.
          # Any restore/verification error aborts the transaction and preserves the prior copy.
          psql "$SUPABASE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f transactional-refresh.sql
          echo "Refresh committed and verified."

