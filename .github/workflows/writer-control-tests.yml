name: Writer control tests

on:
  pull_request:
    paths:
      - "cloudflare/database-control/**"
  push:
    branches:
      - main
      - feat/database-failover-replay
    paths:
      - "cloudflare/database-control/**"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/database-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
